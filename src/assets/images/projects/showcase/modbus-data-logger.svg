<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Modbus TCP machine data logger</title><desc id="desc">Illustrative data architecture showing PLC registers polled by a Python gateway and persisted to SQL for dashboards.</desc><rect width="1600" height="900" fill="#1e2934"/><text x="88" y="96" fill="#ff9d35" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">IIOT / DATA PIPELINE 07</text><text x="88" y="151" fill="#f2f4f1" font-family="Arial,sans-serif" font-size="40" font-weight="700">MACHINE SIGNALS → USEFUL HISTORY</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#293a48" stroke="#66d6c2" stroke-width="3"><rect x="100" y="330" width="290" height="260" rx="18"/><rect x="510" y="330" width="290" height="260" rx="18"/><rect x="920" y="330" width="250" height="260" rx="18"/><rect x="1290" y="330" width="250" height="260" rx="18"/></g><g fill="#f2f4f1" font-size="24" font-weight="700"><text x="245" y="392">PLC</text><text x="655" y="392">PYTHON GATEWAY</text><text x="1045" y="392">SQL STORE</text><text x="1415" y="392">DASHBOARD</text></g><g fill="#aab9c0" font-size="18"><text x="245" y="442">register map</text><text x="655" y="442">poll + buffer</text><text x="1045" y="442">time-series rows</text><text x="1415" y="442">trends + review</text></g></g><g fill="none" stroke="#ff9d35" stroke-width="8"><path d="M390 460h120m-20-20 20 20-20 20M800 460h120m-20-20 20 20-20 20M1170 460h120m-20-20 20 20-20 20"/></g><text x="450" y="530" fill="#66d6c2" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">MODBUS TCP</text><g fill="none" stroke="#aab9c0" stroke-width="5"><path d="M170 500h150m-130 28h130m-145 28h120"/><path d="M970 500h150m-130 28h130m-145 28h120"/></g><rect x="510" y="680" width="660" height="86" rx="14" fill="#344956"/><text x="840" y="733" fill="#f2f4f1" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">RESILIENT POLLING / BUFFERED WRITES / DOWNTIME REVIEW</text><path d="M655 590v90m-19-20 19 20 19-20" fill="none" stroke="#66d6c2" stroke-width="6"/></svg>