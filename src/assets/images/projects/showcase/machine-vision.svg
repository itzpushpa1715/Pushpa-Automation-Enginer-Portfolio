<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Machine vision inspection pipeline</title><desc id="desc">Illustrative inspection pipeline from camera capture through image processing to a classification output.</desc><rect width="1600" height="900" fill="#17263b"/><text x="88" y="96" fill="#66d6c2" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="4">COMPUTER VISION / 04</text><text x="88" y="151" fill="#eff5f5" font-family="Arial,sans-serif" font-size="40" font-weight="700">IMAGE → FEATURES → DECISION</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#243a55" stroke="#66d6c2" stroke-width="3"><rect x="90" y="300" width="300" height="390" rx="16"/><rect x="460" y="300" width="300" height="390" rx="16"/><rect x="830" y="300" width="300" height="390" rx="16"/><rect x="1200" y="300" width="300" height="390" rx="16"/></g><g fill="#eff5f5" font-size="21" font-weight="700"><text x="240" y="355">01 / CAPTURE</text><text x="610" y="355">02 / PREPROCESS</text><text x="980" y="355">03 / MODEL</text><text x="1350" y="355">04 / INSPECT</text></g><g fill="#9fb5c7" font-size="17"><text x="240" y="645">CAMERA + LIGHTING</text><text x="610" y="645">FILTER / NORMALIZE</text><text x="980" y="645">FEATURE LEARNING</text><text x="1350" y="645">CLASS / CONFIDENCE</text></g></g><path d="M164 520h155v-88h-155v88Zm38-66 78 74m-78 0 78-74" fill="none" stroke="#eff5f5" stroke-width="8"/><rect x="534" y="430" width="150" height="135" fill="#e3a348" opacity=".9"/><path d="M534 475h150m-100-45v135m50-135v135" stroke="#fff" stroke-width="4" opacity=".8"/><g fill="#66d6c2"><rect x="892" y="450" width="35" height="35" rx="4"/><rect x="948" y="420" width="35" height="65" rx="4"/><rect x="1004" y="390" width="35" height="95" rx="4"/><rect x="1060" y="435" width="35" height="50" rx="4"/></g><circle cx="1350" cy="482" r="76" fill="none" stroke="#66d6c2" stroke-width="8"/><path d=